# Fixed Azure Web App Node.js CI/CD workflow.
# What changed vs the stock starter template:
#  1. actions/upload-artifact@v3 + download-artifact@v3 -> @v4
#     (v3 was shut down by GitHub; the old workflow fails at the artifact step today)
#  2. App name no longer hardcoded as "your-app-name".
#     Set a repository variable named AZURE_WEBAPP_NAME in
#     Settings -> Secrets and variables -> Actions -> Variables.
#     The workflow fails fast with a clear error if it is missing.
#  3. npm install -> npm ci (clean, reproducible CI installs).
#
# Still required on your side (cannot be fixed in YAML):
#  - AZURE_WEBAPP_PUBLISH_PROFILE secret (Azure Portal -> your Web App -> Overview -> Get publish profile)
#  - AZURE_WEBAPP_NAME repository variable (Settings -> Secrets and variables -> Actions -> Variables)
#  - Actual Node app code in the repo (package.json with start script); this repo currently has none.
#  - On the App Service itself: Node 20 stack, and set SCM_DO_BUILD_DURING_DEPLOYMENT=true
#    (Azure then runs npm install / npm run build on the server, since the shipped zip
#    deliberately excludes node_modules). Or ship node_modules and turn that setting off.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_PACKAGE_PATH: '.'
  NODE_VERSION: '20.x'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check AZURE_WEBAPP_NAME is configured
      run: |
        if [ -z "${{ vars.AZURE_WEBAPP_NAME }}" ]; then
          echo "ERROR: repository variable AZURE_WEBAPP_NAME is not set."
          echo "Set it in Settings -> Secrets and variables -> Actions -> Variables."
          exit 1
        fi
        echo "Deploying to Azure Web App: ${{ vars.AZURE_WEBAPP_NAME }}"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: npm ci, build, and test
      run: |
        npm ci
        npm run build --if-present
        npm run test --if-present

    - name: Package (no node_modules / git / CI)
      run: |
        mkdir -p "${{ runner.temp }}/package"
        rsync -a \
          --exclude node_modules \
          --exclude .git \
          --exclude .github \
          --exclude coverage \
          ./ "${{ runner.temp }}/package/"

    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@v4
      with:
        name: node-app
        path: ${{ runner.temp }}/package
        include-hidden-files: true

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: node-app
        path: .

    - name: 'Deploy to Azure WebApp'
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ vars.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
